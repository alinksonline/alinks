name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_URL: https://alinks.vercel.app
      NEXT_PUBLIC_ROOT_DOMAIN: alinks.vercel.app
      NEXT_PUBLIC_PLATFORM_HOST: alinks.vercel.app
      NEXT_PUBLIC_MARKETING_HOST: alinks.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run test

      - run: npm run lint

      - run: npm run build